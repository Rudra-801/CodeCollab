services:
  - type: web
    name: codecollab
    runtime: node
    buildCommand: npm install && npm run install:all && npm run build
    startCommand: npm start --prefix server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: codecollab
