name: Verify CodeCollab
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --prefix client && npm ci --prefix functions && npm ci --prefix presence
      - run: npm test && npm run build
      - run: npm install --global firebase-tools
      - run: firebase emulators:exec --project demo-codecollab --only auth,functions,firestore,storage "npm run test:security"
      - run: npx --prefix client playwright install --with-deps chrome
      - run: |
          VITE_EMULATORS=true npm run build
          npm run preview --prefix client -- --host 127.0.0.1 --port 5178 &
          firebase emulators:exec --project demo-codecollab --only auth,functions,firestore,storage "npm run test:browser"

